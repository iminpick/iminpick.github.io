<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>썸 7일: 사귈 수 있을까</title>
<meta name="description" content="지우랑 카톡 7일, 너무 들이대도 너무 무심해도 끝나요, 엔딩은 8개예요">
<meta property="og:title" content="썸 7일: 사귈 수 있을까">
<meta property="og:description" content="너무 들이대도 너무 무심해도 끝나요, 엔딩은 8개예요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#ff375f;--aon:#fff;--me:#fee500}
body{overflow-x:hidden}
#s-game{padding:0;margin:-28px -22px -40px;min-height:100vh}
.hud{position:sticky;top:0;z-index:4;background:#000;padding:14px 18px 12px;border-bottom:1px solid #1d1d1d}
.hrow{display:flex;justify-content:space-between;align-items:center}
.who b{font-size:17px}.who span{display:block;font-size:12px;color:#777;margin-top:2px}
.day{font-size:13px;font-weight:800;color:#aaa;text-align:right}
.gauge{position:relative;height:10px;border-radius:6px;background:#222;margin-top:12px;overflow:visible}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--a);transition:width .6s cubic-bezier(.2,.9,.3,1.2),background .4s}
.gauge em{position:absolute;right:0;top:-22px;font-style:normal;font-size:12px;font-weight:800;color:#aaa}
.delta{position:absolute;top:-30px;font-size:18px;font-weight:900;opacity:0;pointer-events:none}
.delta.go{animation:up 1s forwards}
@keyframes up{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.chat{padding:16px 18px 210px;display:flex;flex-direction:column;gap:8px}
.time{align-self:center;font-size:12px;color:#666;background:#151515;padding:4px 10px;border-radius:10px;margin:8px 0}
.b{max-width:78%;padding:11px 14px;font-size:16px;line-height:1.45;border-radius:18px;opacity:0;transform:translateY(8px);transition:.22s}
.b.in{opacity:1;transform:none}
.them{align-self:flex-start;background:#1f1f22;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--me);color:#111;border-bottom-right-radius:4px;position:relative}
.me .one{position:absolute;left:-14px;bottom:2px;font-size:11px;font-weight:800;color:var(--me);transition:opacity .4s}
.sys{align-self:center;font-size:13px;color:#888;font-style:italic}
.typing{align-self:flex-start;background:#1f1f22;border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#888;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;background:linear-gradient(transparent,#000 22%);padding:28px 18px 20px;z-index:5}
.tbar{display:none;height:3px;background:#222;border-radius:3px;overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;background:#fff;transform-origin:left}
.tbar.hurry i{background:#ff453a}
.opts{display:grid;gap:8px}
.op{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:#161616;border:1px solid #2c2c2c;font-size:16px;font-weight:700;line-height:1.35;transition:transform .1s}
.op:active{transform:scale(.97);background:var(--me);color:#111}
.dayover{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .4s}
.dayover.on{opacity:1}
.dayover b{font-size:56px;font-weight:900;letter-spacing:-2px}
.dayover span{color:#888;margin-top:8px;font-size:15px}
.shake2{animation:shake .35s}
#ename{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.25;margin-top:6px}
.last{margin-top:18px;align-self:flex-start;background:#1f1f22;padding:12px 15px;border-radius:18px 18px 18px 4px;font-size:16px;line-height:1.45;max-width:90%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.stats div{background:#111;border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;color:#888}
.stats b{display:block;font-size:22px;color:#fff;margin-bottom:2px}
.col{margin-top:24px}
.col p{font-size:13px;color:#888;margin-bottom:8px}
.col ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.col li{font-size:13px;padding:9px 10px;border-radius:10px;background:#111;color:#555}
.col li.got{color:#fff;background:#2a1018;border:1px solid #5a1a2a}
.col li.now{border-color:var(--a);color:#fff}
</style>
</head>

<section class="screen on" id="s-start">

<section class="screen reveal" id="s-result">

  <p id="ename"></p>
  <p class="last" id="elast"></p>
  <div class="list" id="elist"></div>
  <div class="stats" id="stats"></div>
  <div class="col" id="col"></div>
  <div><button class="go" id="retry" style="margin-top:24px">다른 엔딩 보러 가기</button></div>
  <div class="ad"></div>
  <div><button class="sub" id="share">엔딩 자랑하기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>

  <p class="foot">지우와의 대화는 전부 지어낸 거예요<br>재미로 하는 게임이에요</p>
</section>
</div>

  $("gi").style.background=g>=70?"#ff375f":g>=40?"#ff9f0a":"#8e8e93";
  if(dx){const d=$("delta");d.textContent=(dx>0?"+":"")+dx;d.style.color=dx>0?"#ff375f":"#8e8e93";d.style.left=Math.max(0,Math.min(90,g))+"%";d.classList.remove("go");void d.offsetWidth;d.classList.add("go")}
  $("status").textContent=g>=75?"요즘 자주 웃는 사람":g>=50?"같은 수업 듣는 사람":g>=25?"조금 멀어진 사람":"답장이 짧아진 사람";
}
async function dayCard(d){$("dob").textContent=d+"일째";$("dos").textContent=["","처음 연락한 날","조금 편해진 날","새벽 카톡","약속 잡는 날","영화 보는 날","흔들리는 날","마지막 날"][d];$("dayover").classList.add("on");await wait(1100);$("dayover").classList.remove("on");await wait(300)}
async function start(){
  P.track("start");k=0;st={G:0,E:0,C:0,miss:0,fast:0};$("chat").innerHTML="";setG(50,0);P.show("s-game");run();
}
async function run(){
  if(k>=EV.length)return finish();
  const [d,time,msg,opts,to,sys]=EV[k];
  if(k===0||EV[k-1][0]!==d){await dayCard(d);$("dayl").textContent=d+"일째";P.track("day"+d)}
  note("time",time);
  if(msg){const ty=note("typing","");ty.innerHTML="<i></i><i></i><i></i>";await wait(500+Math.min(900,msg.length*25));ty.remove();bub("them",msg);P.buzz(14)}
  else{await wait(400);note("sys",sys)}
  lim=Math.max(3200,6800-d*500);
  const sh=opts.slice().sort(()=>Math.random()-.5);
  $("opts").innerHTML="";sh.forEach(o=>{const b=document.createElement("button");b.className="op";b.textContent=o[0];b.onclick=()=>answer(o,false);$("opts").appendChild(b)});
  lock=false;t0=performance.now();
}
function tick(){const el=performance.now()-t0;$("ti").style.transform="scaleX("+Math.max(0,1-el/lim)+")";if(el>lim*.6)$("tbar").classList.add("hurry");if(el>=lim){const e=EV[k],to=e[4]||[-5,"C","","(읽음)"];return answer([to[3],to[0],to[1],to[2]],true)}raf=requestAnimationFrame(tick)}
async function answer(o,timeout){
  if(lock)return;lock=true;cancelAnimationFrame(raf);$("opts").innerHTML="";
  const ms=performance.now()-t0;if(!timeout&&ms<1500)st.fast++;if(timeout)st.miss++;
  const [txt,dx,ty,react]=o;
  if(ty==="CONF"||ty==="WAIT"){if(txt)bub("me",txt);P.track(ty==="CONF"?"confess":"wait");await wait(900);return finish(ty)}
  if(txt&&!txt.startsWith("(")){const m=bub("me",txt);const one=document.createElement("span");one.className="one";one.textContent="1";m.appendChild(one);setTimeout(()=>one.style.opacity=0,700)}
  else if(txt)note("sys",txt);
  st[ty]=(st[ty]||0)+1;P.buzz(dx>0?10:[30,40,30]);
  await wait(700);setG(g+dx,dx);if(dx<0){$("chat").classList.add("shake2");setTimeout(()=>$("chat").classList.remove("shake2"),350)}
  if(react){const tyd=note("typing","");tyd.innerHTML="<i></i><i></i><i></i>";await wait(700);tyd.remove();bub("them",react)}
  await wait(650);
  if(g<=0)return finish("FAIL");
  k++;run();
}
function finish(kind){
  let e;
  if(kind==="FAIL")e=st.E>=st.C?"tooeager":"cold";
  else if(kind==="CONF")e=g>=75?"couple":g>=45?"friend":"rejected";
  else e=g>=75?"herconf":g>=45?"limbo":"drift";
  P.track("finish");P.track("end:"+e);
  const isNew=!got.includes(e);if(isNew){got.push(e);try{localStorage.setItem("some7_end",JSON.stringify(got))}catch(x){}}
  const E=END[e];
  $("rtop").textContent=(isNew?"새 엔딩 · ":"엔딩 · ")+got.length+"/8 모음";
  $("ename").textContent=E[0];$("elast").textContent="지우: "+E[1];
  $("elist").innerHTML=E[2].map(x=>"<p>"+x+"</p>").join("");
  $("stats").innerHTML='<div><b>'+g+'</b>호감도</div><div><b>'+st.fast+'</b>즉답</div><div><b>'+(st.E||0)+'</b>들이댐</div><div><b>'+((st.C||0))+'</b>무심</div>';
  $("col").innerHTML='<p>엔딩 수집 '+got.length+'/8</p><ul>'+ORDER.map(x=>'<li class="'+(got.includes(x)?"got":"")+(x===e?" now":"")+'">'+(got.includes(x)?END[x][0]:"???")+'</li>').join("")+'</ul>';
  $("s-result").dataset.e=e;P.setUrl("?e="+e);
  P.show("s-result");P.renderNext($("next"));
  [...$("s-result").children].forEach((el,j)=>{el.classList.remove("show");setTimeout(()=>el.classList.add("show"),j*180)});
}
$("go").onclick=start;$("retry").onclick=()=>{P.track("retry");start()};
$("share").onclick=()=>{const e=$("s-result").dataset.e;P.share("나 썸 7일에서 '"+END[e][0]+"' 엔딩 봄 ㅋㅋ (엔딩 "+got.length+"/8) 너는 사귈 수 있냐","?e="+e)};
$("copy").onclick=()=>P.copyLink("?e="+$("s-result").dataset.e);
$("save").onclick=()=>{const e=$("s-result").dataset.e;P.saveImage([{t:"썸 7일",size:46,weight:700,color:"#888"},{t:"엔딩",size:50,weight:700,color:"#ff375f",gap:60},{t:END[e][0],size:96,gap:10},{t:"지우: "+END[e][1],size:46,weight:500,color:"#ccc",gap:50},{t:"엔딩 "+got.length+"/8 모음",size:44,weight:700,color:"#888",gap:60},{t:"너는 사귈 수 있어?",size:52,weight:800,color:"#ff375f",gap:60}],"some7")};
</script>
