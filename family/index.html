<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 집에서 나는 어떤 자식일까</title>
<meta name="description" content="가족 단톡방, 명절, 부모님 폰 고장 날 때 다 티가 나요">
<meta property="og:title" content="우리 집에서 나는 어떤 자식일까">
<meta property="og:description" content="가족 단톡방, 명절, 부모님 폰 고장 날 때 다 티가 나요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#ff9f0a;--aon:#000}
.q{margin:36px 0 6px}
#ctx{font-size:14px;color:#666;margin-bottom:auto;min-height:20px}
.tname{font-size:24px;font-weight:800;margin-top:30px}

</style>
</head>
<body class="">
<div class="tline" id="tl" style="display:none"></div>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">가족 테스트</p>
  <h1 class="big" id="hook" style="margin-top:14px">우리 집에서 나는<br>어떤 자식일까요?</h1>
  <p class="small" style="margin-top:16px">8문제면 끝나요<br>가족 단톡방에 보내면 다들 해봐요</p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <p id="ctx"></p>
  <div class="choices" id="choices"></div>
</section>
<section class="screen" id="s-wait"><div class="dots"><i></i><i></i><i></i></div></section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div id="extra"></div>
  <p class="tname" id="tname"></p>
  <div class="list" id="list"></div>
  <div class="ad"></div>
  <div><button class="go" id="share">가족 단톡방에 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <button class="again" id="again">다시 하기</button>
  <p class="foot">재미로 보는 테스트예요<br>답은 저장하지 않아요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/quick.js"></script>
<script>

const R={"it": ["집안 IT 담당", ["부모님 폰 설정은 다 당신 몫이에요", "\"이거 왜 안 돼?\" 전화를 제일 많이 받아요", "가족 단톡방에 사진 보내는 법도 당신이 알려드렸어요"]], "nonews": ["무소식이 희소식", ["연락은 드문데 잘 지내고 있어요", "근황은 명절에 몰아서 말해요", "부모님은 사실 연락을 기다리고 계세요"]], "sweet": ["안부 담당", ["하루 한 번은 안부를 물어요", "부모님 생신, 결혼기념일을 다 기억해요", "가족 단톡방이 당신 덕에 살아 있어요"]], "shield": ["잔소리 피뢰침", ["집안 잔소리는 당신한테 먼저 와요", "형제 대신 혼난 적도 있어요", "그래도 무슨 일 생기면 제일 먼저 달려가요"]], "mood": ["집안 분위기 메이커", ["밥상에서 제일 많이 웃겨요", "부모님이 다투시면 중간에서 풀어요", "당신 없으면 명절이 조용해요"]], "indep": ["알아서 하는 자식", ["웬만한 건 혼자 알아서 해요", "걱정 끼치기 싫어서 말 안 하는 것도 있어요", "가끔은 기대도 괜찮아요"]]};
const fk=PICK.param("r");
quickTest({id:"family",limit:0,shuffle:true,
 friend:()=>fk&&R[fk]?["가족은 '{n}' 나왔대요".replace("{n}",R[fk][0]),"나는 우리 집에서 뭘까요?"]:null,
 questions:[{"q": "부모님 폰이 이상하대요", "o": [["전화로 원격 해결", "it"], ["다음에 가서 볼게요", "nonews"], ["새로 사드릴까 고민", "indep"]]}, {"q": "가족 단톡방에 사진이 올라왔다", "o": [["바로 하트", "sweet"], ["읽고 나중에 답장", "nonews"], ["웃긴 댓글 담", "mood"]]}, {"q": "명절에 친척 질문 공세", "o": [["웃으면서 넘김", "mood"], ["내가 대신 다 받음", "shield"], ["조용히 방으로", "indep"]]}, {"q": "부모님 생신", "o": [["한 달 전부터 준비", "sweet"], ["형제랑 같이 준비", "shield"], ["당일에 깜빡할 뻔", "nonews"]]}, {"q": "힘든 일이 생기면", "o": [["혼자 해결", "indep"], ["엄마한테 바로 전화", "sweet"], ["가족한텐 말 안 함", "nonews"]]}, {"q": "집에 가면 제일 먼저", "o": [["와이파이부터 확인", "it"], ["밥부터 먹음", "mood"], ["잔소리 들을 준비", "shield"]]}, {"q": "부모님이 키오스크를 어려워하신다", "o": [["사용법 알려드림", "it"], ["대신 주문해드림", "sweet"], ["같이 해보자고 함", "mood"]]}, {"q": "독립 얘기가 나오면", "o": [["이미 준비 중", "indep"], ["부모님 걱정이 먼저", "shield"], ["일단 웃음", "mood"]]}],
 compute(a){
  const c={};a.forEach(x=>{if(x.data)c[x.data]=(c[x.data]||0)+1});
  const k=Object.keys(c).sort((p,q)=>c[q]-c[p]||Math.random()-.5)[0],r=R[k];
  return {hit:"우리 집에서 나는"+"<br><u>"+r[0]+"</u>",name:"",lines:r[1],q:"?r="+k,
   share:"우리 집에서 나는 '{n}'래 ㅋㅋ 다들 해봐".replace("{n}",r[0]),
   img:[{t:"우리 집에서 나는",size:46,weight:700,color:"#888"},{t:r[0],size:100,gap:40},{t:r[1][0],size:48,weight:600,color:"#ccc",gap:60},{t:"우리 집에서 너는 뭐야?",size:46,weight:700,color:"#ff9f0a",gap:80}]};
 }});

</script>
</body>
</html>
