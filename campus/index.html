<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>대학 생활 유형 테스트</title>
<meta name="description" content="강의실 자리, 조별과제, 시험 기간에 다 보여요">
<meta property="og:title" content="대학 생활 유형 테스트">
<meta property="og:description" content="강의실 자리, 조별과제, 시험 기간에 다 보여요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#bf5af2;--aon:#fff}
.q{margin:36px 0 6px}
#ctx{font-size:14px;color:#666;margin-bottom:auto;min-height:20px}
.tname{font-size:24px;font-weight:800;margin-top:30px}

</style>
</head>
<body class="">
<div class="tline" id="tl" style="display:none"></div>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">대학생 테스트</p>
  <h1 class="big" id="hook" style="margin-top:14px">대학교에서 나는<br>어떤 유형일까요?</h1>
  <p class="small" style="margin-top:16px">8문제면 끝나요<br>과 단톡방에 던지기 좋아요</p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <p id="ctx"></p>
  <div class="choices" id="choices"></div>
</section>
<section class="screen" id="s-wait"><div class="dots"><i></i><i></i><i></i></div></section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div id="extra"></div>
  <p class="tname" id="tname"></p>
  <div class="list" id="list"></div>
  <div class="ad"></div>
  <div><button class="go" id="share">과 단톡방에 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <button class="again" id="again">다시 하기</button>
  <p class="foot">재미로 보는 테스트예요<br>답은 저장하지 않아요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/quick.js"></script>
<script>

const R={"front": ["앞자리 장학생", ["교수님이 이름을 기억해요", "과제는 마감 3일 전에 끝내요", "시험 기간엔 동기들 필기 공급처예요"]], "ghost": ["출석만 하는 유령", ["출석 체크는 하는데 수업 기억이 없어요", "강의실 맨 뒷자리가 지정석이에요", "그래도 학점은 신기하게 나와요"]], "leader": ["조장 전문", ["조별과제만 하면 조장이 돼요", "단톡방 공지는 항상 당신이 올려요", "무임승차 조원 때문에 마음고생이 많아요"]], "cram": ["벼락치기 장인", ["시험 전날 밤에 집중력이 폭발해요", "에너지 음료 맛을 브랜드별로 알아요", "'이번엔 미리 해야지'를 매 학기 다짐해요"]], "club": ["동아리가 본업", ["학과보다 동아리방이 더 편해요", "행사 준비할 때 제일 살아 있어요", "졸업하면 제일 그리울 게 동아리일 거예요"]], "gap": ["휴학 고민러", ["학기 중에 휴학 방법을 검색해요", "'나 뭐 하고 있지' 생각이 자주 들어요", "고민하는 것 자체가 방향을 찾는 중이에요"]]};
const fk=PICK.param("r");
quickTest({id:"campus",limit:0,shuffle:true,
 friend:()=>fk&&R[fk]?["동기는 '{n}' 나왔대요".replace("{n}",R[fk][0]),"나는 어떤 유형일까요?"]:null,
 questions:[{"q": "강의실에 들어가면", "o": [["앞자리", "front"], ["맨 뒷자리", "ghost"], ["친구 옆자리", "club"]]}, {"q": "조별과제 조가 발표됐다", "o": [["단톡방부터 만듦", "leader"], ["누가 하겠지", "ghost"], ["일단 미뤄둠", "cram"]]}, {"q": "시험 일주일 전", "o": [["이미 정리 끝", "front"], ["아직 시작 안 함", "cram"], ["동아리 행사 준비 중", "club"]]}, {"q": "공강 시간", "o": [["알바하러 감", "gap"], ["동아리방", "club"], ["집에 감", "ghost"]]}, {"q": "과제 마감 1시간 전", "o": [["이미 제출함", "front"], ["지금 쓰는 중", "cram"], ["조원들 독촉 중", "leader"]]}, {"q": "학기 중 제일 많이 한 검색", "o": [["조별과제 회의 장소", "leader"], ["휴학 신청 방법", "gap"], ["축제 라인업", "club"]]}, {"q": "수업 끝나고", "o": [["교수님께 질문", "front"], ["바로 알바", "gap"], ["바로 집", "ghost"]]}, {"q": "다음 학기 생각하면", "o": [["시간표 벌써 짰음", "leader"], ["그때 가서 생각", "cram"], ["다닐지 고민 중", "gap"]]}],
 compute(a){
  const c={};a.forEach(x=>{if(x.data)c[x.data]=(c[x.data]||0)+1});
  const k=Object.keys(c).sort((p,q)=>c[q]-c[p]||Math.random()-.5)[0],r=R[k];
  return {hit:"대학교에서 나는"+"<br><u>"+r[0]+"</u>",name:"",lines:r[1],q:"?r="+k,
   share:"나 대학 생활 유형 '{n}'래 ㅋㅋ 너는?".replace("{n}",r[0]),
   img:[{t:"대학교에서 나는",size:46,weight:700,color:"#888"},{t:r[0],size:100,gap:40},{t:r[1][0],size:48,weight:600,color:"#ccc",gap:60},{t:"너는 어떤 유형이야?",size:46,weight:700,color:"#bf5af2",gap:80}]};
 }});

</script>
</body>
</html>
