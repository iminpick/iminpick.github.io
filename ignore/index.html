<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>썸남 카톡 읽씹, 몇 초 버틸 수 있어요?</title>
<meta name="description" content="답장을 누르면 끝나요, 1 없어지는 것도 다 보여요">
<meta property="og:title" content="썸남 카톡 읽씹, 몇 초 버틸 수 있어요?">
<meta property="og:description" content="답장을 누르면 끝나요, 1 없어지는 것도 다 보여요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#ff2d55;--aon:#fff}
#s-game{padding-bottom:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid #222}
.who{font-size:17px;font-weight:800}.who small{display:block;font-size:12px;color:#666;font-weight:600;margin-top:3px}
#clock{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#chat{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 260px)}
.bub{align-self:flex-start;max-width:78%;background:#1c1c1e;padding:11px 14px;border-radius:18px 18px 18px 4px;font-size:16px;line-height:1.4;opacity:0;transform:translateY(6px) scale(.98);transition:.18s}
.bub.in{opacity:1;transform:none}
.badge{display:inline-block;min-width:22px;padding:2px 7px;border-radius:11px;background:var(--a);color:#fff;font-size:12px;font-weight:800;text-align:center;margin-left:6px}
#btn{position:sticky;bottom:18px;width:100%;padding:22px;font-size:20px;font-weight:900;background:var(--a);color:#fff;border-radius:16px;margin-top:10px;box-shadow:0 -20px 30px #000}
#btn:active{transform:scale(.97)}
#score{font-size:72px;font-weight:900;letter-spacing:-2px;margin-top:22px;color:var(--a)}
.tname{font-size:24px;font-weight:800;margin-top:6px}
#rec,#vs{font-size:14px;color:#888;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">읽씹 버티기</p>
  <h1 class="big" id="hook" style="margin-top:14px">썸 타는 사람한테<br>카톡이 계속 와요<br>답장 누르면 끝이에요</h1>
  <p class="small" style="margin-top:16px">최대한 오래 버텨보세요<br>30초를 버티면 사람이 아니에요</p>
  <p class="small" id="bestline" style="margin-top:10px;color:#ccc"></p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-game">
  <div class="top"><div class="who">썸 타는 중<small>안 읽은 메시지<span class="badge" id="unread">0</span></small></div><div id="clock">0.0</div></div>
  <div id="chat"></div>
  <button id="btn">답장하기</button>
</section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <p id="score"></p>
  <div><p class="tname" id="tname"></p><p id="rec"></p><p id="vs"></p></div>
  <div class="list" id="list"></div>
  <div><button class="go" id="retry" style="margin-top:22px">한 번 더</button></div>
  <div class="ad"></div>
  <div><button class="sub" id="share">친구한테 도전장 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <p class="foot">재미로 하는 게임이에요<br>메시지는 전부 지어낸 거예요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/endure.js"></script>
<script>
endureGame({id:"ignore",title:"읽씹 버티기",name:"썸 타는 중",accent:"#ff2d55",max:30,
 msgs:[[.6,"뭐해?"],[2,"자?"],[3.4,"ㅋㅋ"],[4.8,"아 그거 봤어?"],[6.2,"(사진)"],[7.6,"답장 늦네"],[8.8,"바쁜가"],[10,"아 아니다"],[11.2,"그냥 생각나서 연락했어"],[12.3,"ㅎㅎ"],[13.3,"나 내일 시간 되는데"],[14.2,"너는?"],[15,"..."],[15.8,"읽었잖아"],[16.6,"1 없어진 거 다 보여"],[17.4,"알았어 나 잔다"],[18.2,"아 잠깐"],[18.9,"사실 할 말 있었는데"],[19.6,"보고 싶어서"],[20.3,"아 아니야 신경 쓰지 마"]],
 flood:["답장 좀","ㅠ","진짜 서운하다","나 이제 진짜 잔다","...","ㅠㅠ","너 일부러 그러지","하","마지막으로 물어볼게","보고 싶다니까"],
 results:[[3,"답장 못 참는 사람",["1이 사라지기 전에 이미 답장을 쓰고 있어요","밀당이라는 말은 들어본 적도 없어요","근데 솔직히 이게 제일 건강해요"]],
  [8,"튕겨보려다 실패하는 사람",["'좀 있다 보내야지' 하고 30초 만에 보내요","폰을 엎어놨다가 바로 다시 뒤집어요","티 안 내려는 게 다 티 나요"]],
  [15,"적당히 튕기는 사람",["상대가 한 번 더 보내야 답장해요","'바빴어ㅎㅎ'를 자주 쓰는데 사실 안 바빴어요","밀당은 하는데 오래는 못 가요"]],
  [22,"선 확실한 사람",["사진을 보내도 안 흔들려요","'보고 싶어'에도 버텼다면 진짜예요","상대 입장에선 좀 무서울 수 있어요"]],
  [30,"얼음",["고백 직전까지 읽씹했어요","이건 밀당이 아니라 생존 게임이에요","혹시 그 사람을 안 좋아하는 건 아니죠?"]],
  [999,"사람이 아님",["30초 동안 메시지를 다 씹었어요","'보고 싶다니까'까지 봤는데 안 눌렀어요","이 정도면 그냥 차단한 거랑 같아요"]]],
 hit:(m,t)=>"<u>'"+m+"'</u> 보고<br>"+t+"초 만에 무너졌어요",
 win:(t)=>"30초 동안<br>한 번도 안 눌렀어요",
 share:(t,n)=>"나 썸남 카톡 "+t+"초 읽씹 버팀 ("+n+") 너는?",
 friend:(t)=>["친구는 "+t+"초 버텼대요","이길 수 있어요?"]});
</script>
</body>
</html>
