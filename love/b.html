<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3.5초 안에 골라</title>
<meta name="description" content="고민하면 다 티가 나요, 몇 초 멈췄는지까지 기록돼요">
<meta property="og:title" content="3.5초 안에 골라">
<meta property="og:description" content="고민하면 다 티가 나요">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100%;padding:28px 22px 36px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.big{font-size:34px;font-weight:800;line-height:1.3;letter-spacing:-1px;word-break:keep-all}
.small{font-size:15px;color:#8a8a8a;line-height:1.6;word-break:keep-all}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.go{margin-top:auto;width:100%;padding:20px;font-size:18px;font-weight:800;background:#fff;color:#000;border-radius:14px}
.go:active{opacity:.7}
.line{position:fixed;top:0;left:0;height:3px;width:100%;background:#fff;transform-origin:left}
.line.hurry{background:#ff3b30}
.count{font-size:13px;color:#555;font-weight:700}
.q{margin:40px 0 auto}
.choices{display:grid;gap:10px}
.ch{width:100%;padding:22px 18px;font-size:19px;font-weight:700;text-align:left;border:1px solid #333;border-radius:14px;transition:background .1s}
.ch:active,.ch.pick{background:#fff;color:#000;border-color:#fff}
.ch.fade{opacity:.15}
.miss{animation:miss .3s}
@keyframes miss{30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
.dots{display:flex;gap:6px;margin:auto 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
.r>*{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.r>.show{opacity:1;transform:none}
.hit{font-size:30px;font-weight:800;line-height:1.35;letter-spacing:-.8px;word-break:keep-all;margin-top:8px}
.hit u{text-decoration:none;border-bottom:3px solid #fff}
.type{margin-top:36px;font-size:15px;color:#8a8a8a}
.tname{font-size:24px;font-weight:800;margin-top:4px}
.list{margin-top:18px}
.list p{font-size:17px;line-height:1.5;padding:12px 0;border-top:1px solid #222;word-break:keep-all}
.match{margin-top:22px;font-size:15px;color:#8a8a8a;line-height:1.8}
.match b{color:#fff}
.ad{margin:22px 0;min-height:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sub{padding:16px;border:1px solid #333;border-radius:14px;font-size:15px;font-weight:700}
.next{margin-top:40px}
.next .small{margin-bottom:6px}
.nx{display:block;width:100%;text-align:left;padding:18px 0;border-top:1px solid #222;font-size:19px;font-weight:800;line-height:1.4;word-break:keep-all}
.nx span{display:block;font-size:13px;color:#666;font-weight:600;margin-top:4px}
.nx:after{content:"→";float:right;color:#555;margin-top:-28px}
.again{margin-top:26px;font-size:14px;color:#555;text-decoration:underline;align-self:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#000;font-size:14px;font-weight:700;padding:12px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
/* 주제별 연출 자리: 필요한 테스트에만 #stage 안에 애니메이션/그림을 넣는다 */
#stage:empty{display:none}
</style>
</head>
<body>
<div class="line" id="line" style="display:none"></div>
<div class="app">

<section class="screen on" id="s-start">
  <div id="stage"></div>
  <p class="small" id="pre">연애 직감 테스트</p>
  <h1 class="big" id="hook" style="margin-top:14px">3.5초 안에 골라주세요<br>고민하면 다 티가 나요</h1>
  <p class="small" id="sub" style="margin-top:16px">몇 초 멈췄는지 다 기록돼요<br>시간이 지나면 못 고른 걸로 처리돼요</p>
  <button class="go" id="go">시작</button>
</section>

<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <div class="choices" id="choices"></div>
</section>

<section class="screen" id="s-wait">
  <div class="dots"><i></i><i></i><i></i></div>
</section>

<section class="screen r" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div>
    <p class="type">그래서 당신은</p>
    <p class="tname" id="tname"></p>
  </div>
  <div class="list" id="list"></div>
  <p class="match" id="match"></p>
  <div class="ad" id="ad-1"></div>
  <div>
    <button class="go" id="share">이거 그 사람한테 보내기</button>
    <div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div>
  </div>
  <div class="next">
    <p class="small">이거 한 분들이 다음에 많이 누른 것</p>
    <div id="nexts"></div>
  </div>
  <button class="again" id="again">다시 하기</button>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const V="b";
// 기록: 구글 폼(pick 방문기록) → 시트. 형식 "버전|이벤트|세션ID|유입"
const SID=Math.random().toString(36).slice(2,9);let FR="direct";try{FR=new URLSearchParams(location.search).get("r")?"friend":(document.referrer?new URL(document.referrer).hostname:"direct")}catch(x){}
function track(e){try{if(!location.protocol.startsWith("http"))return;const b=new URLSearchParams();b.append("entry.1016624779",[V,e,SID,FR].join("|"));fetch("https://docs.google.com/forms/d/e/1FAIpQLSf04nq87oC420sNEfEuP0wFoM3ye-Hga7sYIeD989DrfIBKuA/formResponse",{method:"POST",mode:"no-cors",body:b,keepalive:true}).catch(()=>{})}catch(x){}}
track("view");
/* ========= 테스트 데이터 (새 테스트 = 이 부분만 교체) ========= */
const TEST={
  id:"love-gut",
  limit:3500,
  share:(t)=>"나 '"+t+"' 나옴 ㅋㅋ 너는 3.5초 안에 고를 수 있냐",
  fromFriend:(t)=>["친구는 '"+t+"' 나왔대요","해봐야 서로 맞는지 나와요"],
  questions:[
    {q:"썸 타는 사람한테 카톡 옴",ax:"a",o:[["바로 답장","A"],["좀 있다가","W"]]},
    {q:"좋아하는 사람 생기면",ax:"d",o:[["친구들 다 앎","D"],["나만 앎","I"]]},
    {q:"첫 데이트 어디 갈지",ax:"a",o:[["내가 이미 찾아둠","A"],["너 가고 싶은 데","W"]]},
    {q:"서운한 거 생기면",ax:"d",o:[["그날 말함","D"],["그냥 넘김","I"]]},
    {q:"사흘째 연락 없음",ax:"a",o:[["내가 먼저 함","A"],["나도 안 함","W"]]},
    {q:"보고 싶다는 말",ax:"d",o:[["그냥 함","D"],["못 함","I"]]},
    {q:"고백은",ax:"a",o:[["내가 함","A"],["받고 싶음","W"]]},
    {q:"질투 날 때",ax:"d",o:[["티 냄","D"],["아무렇지 않은 척","I"]]},
    {q:"싸운 다음 날",ax:"a",o:[["내가 먼저 연락","A"],["걔가 먼저 해야 됨","W"]]},
    {q:"새벽 2시에 생각남",ax:"d",o:[["보냄","D"],["썼다 지움","I"]]}
  ],
  passive:{a:"W",d:"I"}, // 시간 초과 = 소극적인 쪽으로 계산
  key:(c)=>(c.A>=c.W?"A":"W")+(c.D>=c.I?"D":"I"),
  results:{
    AD:{n:"일단 말하고 보는 쪽",l:["읽씹 당해도 '바쁜가 보다' 하고 하나 더 보내요","밀당하다 답답해서 그냥 전화해요","차여도 사흘이면 멀쩡해요"],g:"WD",b:"WI"},
    AI:{n:"말 대신 몸이 먼저 가는 쪽",l:["'밥 먹었어?'가 사실상 고백이에요","'지나가다 샀어'를 자주 쓰는데 안 지나갔어요","상대가 눈치 없으면 혼자 서운해해요"],g:"WD",b:"AD"},
    WD:{n:"시작만 누가 해주면 되는 쪽",l:["썸 땐 조용한데 사귀면 사람이 바뀌어요","'먼저 연락 좀 해주지' 생각만 백 번 해요","한번 정을 주면 오래 가요"],g:"AD",b:"WI"},
    WI:{n:"혼자 시작해서 혼자 끝내는 쪽",l:["답장 한 줄을 30분 고쳐 써요","스토리는 제일 먼저 보는데 좋아요는 안 눌러요","'그때 말할걸'이 몇 개 있어요"],g:"AI",b:"AD"}
  },
  next:[
    {t:"그 사람 카톡을 넣으면 나한테 관심 있는지 보여요",s:"답장 속도랑 ㅋ 개수로 봐요",u:"../kakao/?from=love"},
    {t:"'안 고른' 답으로 보는 진짜 성격",s:"고른 것보다 이게 더 잘 맞아요",u:"../unpicked/?from=love"},
    {t:"썸남 카톡 읽씹, 몇 초 버틸 수 있어요?",s:"답장 누르면 끝나는 게임",u:"../ignore/?from=love"},{t:"2026 연애 정산서",s:"12월 한정",u:"../receipt/?from=love"}
  ]
};

/* ========= 엔진 (모든 테스트 공통) ========= */
const $=id=>document.getElementById(id);
let i=0,ans=[],t0=0,raf=0,lock=false,curKey="";
function setUrl(q){try{history.replaceState(null,"",location.pathname+q)}catch(e){}}
function shareUrl(){try{if(location.protocol.startsWith("http"))return location.origin+location.pathname.replace(/[^/]*$/,"")+"?r="+curKey}catch(e){}return ""}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
function toast(m){$("toast").textContent=m;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1800)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function start(){track("start");i=0;ans=[];show("s-quiz");$("line").style.display="block";ask()}
function ask(){
  lock=false;track("q"+(i+1));const it=TEST.questions[i];
  $("count").textContent=(i+1)+"/"+TEST.questions.length;
  $("q").textContent=it.q;
  $("choices").innerHTML="";
  it.o.forEach(([tx,v])=>{const b=document.createElement("button");b.className="ch";b.textContent=tx;b.onclick=()=>pick(v,b);$("choices").appendChild(b)});
  t0=performance.now();$("line").classList.remove("hurry");tick();
}
function tick(){
  const el=performance.now()-t0;
  $("line").style.transform="scaleX("+Math.max(0,1-el/TEST.limit)+")";
  if(el>TEST.limit*.6)$("line").classList.add("hurry");
  if(el>=TEST.limit)return miss();
  raf=requestAnimationFrame(tick);
}
function pick(v,b){
  if(lock)return;lock=true;cancelAnimationFrame(raf);
  const it=TEST.questions[i];ans.push({v,ms:performance.now()-t0,q:it.q,miss:false});buzz(10);
  [...$("choices").children].forEach(c=>c.classList.add(c===b?"pick":"fade"));
  setTimeout(next,180);
}
function miss(){
  lock=true;const it=TEST.questions[i];ans.push({v:TEST.passive[it.ax],ms:TEST.limit,q:it.q,miss:true});buzz([25,40,25]);
  $("choices").classList.add("miss");setTimeout(()=>$("choices").classList.remove("miss"),300);
  setTimeout(next,380);
}
function next(){i++;i<TEST.questions.length?ask():finish()}
function finish(){track("finish");
  $("line").style.display="none";show("s-wait");
  const c={};ans.forEach(a=>c[a.v]=(c[a.v]||0)+1);["A","W","D","I"].forEach(k=>c[k]=c[k]||0);
  curKey=TEST.key(c);setUrl("?r="+curKey);
  const done=ans.filter(a=>!a.miss),slow=done.slice().sort((x,y)=>y.ms-x.ms)[0],misses=ans.filter(a=>a.miss);
  setTimeout(()=>{buzz([15,60,15]);render(curKey,slow,misses)},1600);
}
function hitLine(slow,misses){
  if(misses.length>=3)return "10개 중에 <u>"+misses.length+"개</u>를 못 골랐어요<br>연애에선 그게 제일 큰 답이에요";
  if(misses.length)return "<u>'"+misses[0].q+"'</u>에서 아무것도 못 눌렀어요"+(slow&&slow.ms>1500?"<br>그리고 <u>'"+slow.q+"'</u>에선 "+(slow.ms/1000).toFixed(1)+"초 멈췄고요":"");
  if(slow&&slow.ms>1800)return "<u>'"+slow.q+"'</u>에서 "+(slow.ms/1000).toFixed(1)+"초 멈췄어요<br>거기가 제일 약한 부분이에요";
  return "10개 다 1.8초 안에 골랐어요<br>고민을 별로 안 하는 편이네요";
}
function render(key,slow,misses){
  const r=TEST.results[key];
  $("hit").innerHTML=hitLine(slow,misses);
  $("tname").textContent=r.n;
  $("list").innerHTML=r.l.map(x=>"<p>"+x+"</p>").join("");
  $("match").innerHTML="잘 맞는 사람 <b>"+TEST.results[r.g].n+"</b><br>만나면 피곤한 사람 <b>"+TEST.results[r.b].n+"</b>";
  $("nexts").innerHTML=TEST.next.map((n,k)=>'<button class="nx" data-k="'+k+'">'+n.t+'<span>'+n.s+'</span></button>').join("");
  document.querySelectorAll(".nx").forEach(b=>b.onclick=()=>{track("next");const n=TEST.next[b.dataset.k];if(n.u)location.href=n.u;else toast("아직 준비 중이에요")});
  document.title="나는 '"+r.n+"' | 3.5초 안에 골라";
  show("s-result");
  [...$("s-result").children].forEach((el,k)=>setTimeout(()=>el.classList.add("show"),k*260));
}
function fromFriend(key){const r=TEST.results[key];if(!r)return;const [a,b]=TEST.fromFriend(r.n);$("pre").textContent="친구 결과 도착";$("hook").innerHTML=a+"<br>"+b;$("go").textContent="나도 해보기"}

$("go").onclick=()=>{buzz(10);start()};
$("share").onclick=()=>{track("share");
  const url=shareUrl(),txt=TEST.share($("tname").textContent);
  if(!url)return toast("공유는 사이트에서 열었을 때 돼요");
  try{navigator.share?navigator.share({text:txt,url}).catch(()=>{}):copyText(txt+" "+url)}catch(e){toast("여기선 공유가 막혀 있어")}
};
$("copy").onclick=()=>{track("copy");const url=shareUrl();if(!url)return toast("링크는 사이트에서 열었을 때 돼요");copyText(url)};
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast("복사됐어요"),()=>toast("여기서는 복사가 막혀 있어요"))}catch(e){toast("여기서는 복사가 막혀 있어요")}}
$("save").onclick=()=>{track("save");
  try{
    const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    x.fillStyle="#000";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="left";
    x.font="600 40px sans-serif";x.fillStyle="#777";x.fillText("3.5초 안에 골라",90,260);
    x.fillStyle="#fff";x.font="800 72px sans-serif";
    let y=wrap(x,$("hit").textContent,90,420,900,100);
    x.font="600 40px sans-serif";x.fillStyle="#777";x.fillText("그래서 나는",90,y+160);
    x.fillStyle="#fff";x.font="800 64px sans-serif";wrap(x,$("tname").textContent,90,y+250,900,84);
    x.font="700 40px sans-serif";x.fillStyle="#777";x.fillText("너는 몇 초 멈출 것 같아?",90,1760);
    const a=document.createElement("a");a.download="3.5초.png";a.href=c.toDataURL("image/png");a.click();toast("저장됐어요");
  }catch(e){toast("여기서는 저장이 막혀 있어요")}
};
function wrap(x,t,lx,y,max,lh){let line="";for(const w of t.split("")){const s=line+w;if(x.measureText(s).width>max){x.fillText(line,lx,y);line=w;y+=lh}else line=s}x.fillText(line,lx,y);return y}
$("again").onclick=()=>{setUrl("");$("s-result").querySelectorAll(".show").forEach(e=>e.classList.remove("show"));show("s-start")};

let p=null;try{p=new URLSearchParams(location.search).get("r")}catch(e){}
if(p)fromFriend(p);
</script>
</body>
</html>
