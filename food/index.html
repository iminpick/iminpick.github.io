<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>나랑 닮은 야식은?</title>
<meta name="description" content="밤 11시에 뭐 먹는지 보면 사람이 보여요">
<meta property="og:title" content="나랑 닮은 야식은?">
<meta property="og:description" content="밤 11시에 뭐 먹는지 보면 사람이 보여요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#ff453a;--aon:#fff}
.q{margin:36px 0 6px}
#ctx{font-size:14px;color:#666;margin-bottom:auto;min-height:20px}
.tname{font-size:24px;font-weight:800;margin-top:30px}

</style>
</head>
<body class="">
<div class="tline" id="tl" style="display:none"></div>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">야식 테스트</p>
  <h1 class="big" id="hook" style="margin-top:14px">나랑 닮은 야식은<br>뭘까요?</h1>
  <p class="small" style="margin-top:16px">8문제면 끝나요<br>배고플 수 있어요</p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <p id="ctx"></p>
  <div class="choices" id="choices"></div>
</section>
<section class="screen" id="s-wait"><div class="dots"><i></i><i></i><i></i></div></section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div id="extra"></div>
  <p class="tname" id="tname"></p>
  <div class="list" id="list"></div>
  <div class="ad"></div>
  <div><button class="go" id="share">친구한테 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <button class="again" id="again">다시 하기</button>
  <p class="foot">재미로 보는 테스트예요<br>답은 저장하지 않아요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/quick.js"></script>
<script>

const R={"tteok": ["떡볶이", ["맵다고 하면서 끝까지 먹어요", "스트레스 받으면 제일 먼저 생각나요", "친구들이랑 있을 때 제일 신나요"]], "gukbap": ["국밥", ["화려하진 않은데 믿음직해요", "혼밥도 아무렇지 않아요", "힘들 때 다들 당신을 찾아요"]], "mala": ["마라탕", ["좋아하는 건 확실히 골라 담아요", "새로운 건 먼저 해보는 편이에요", "취향이 분명해서 가끔 고집스러워 보여요"]], "chicken": ["치킨", ["어디 가도 다들 좋아해요", "모임이 있으면 꼭 불려 가요", "가끔은 혼자 쉬고 싶을 때도 있어요"]], "ramen": ["편의점 라면", ["계획 없이 움직여도 잘 살아요", "새벽에 제일 활발해져요", "소박한 데서 행복을 잘 찾아요"]], "jokbal": ["족발", ["시작은 느린데 한번 하면 진심이에요", "혼자보다 여럿이 있을 때 빛나요", "한번 친해지면 오래 가요"]]};
const fk=PICK.param("r");
quickTest({id:"food",limit:0,shuffle:true,
 friend:()=>fk&&R[fk]?["친구는 '{n}' 나왔대요".replace("{n}",R[fk][0]),"나는 무슨 야식일까요?"]:null,
 questions:[{"q": "밤 11시, 배고프다", "o": [["참는다", "gukbap"], ["바로 배달앱", "chicken"], ["편의점으로 간다", "ramen"]]}, {"q": "약속 장소 정할 때", "o": [["맛집 리스트 꺼냄", "mala"], ["다들 좋아하는 곳", "chicken"], ["가던 데 감", "gukbap"]]}, {"q": "스트레스 받으면", "o": [["매운 거", "tteok"], ["따뜻한 국물", "gukbap"], ["많이 먹기", "jokbal"]]}, {"q": "주말 오후", "o": [["친구들 만남", "tteok"], ["새로운 데 가봄", "mala"], ["집에서 뒹굴", "ramen"]]}, {"q": "단톡방에서 나는", "o": [["말 많은 편", "tteok"], ["필요할 때만", "ramen"], ["모임 잡는 편", "jokbal"]]}, {"q": "새로 생긴 가게", "o": [["오픈날 감", "mala"], ["리뷰 쌓이면 감", "chicken"], ["누가 가자고 하면", "ramen"]]}, {"q": "여행 가면", "o": [["먹는 일정 위주", "jokbal"], ["즉흥으로 다님", "ramen"], ["사진 명소 위주", "mala"]]}, {"q": "친구가 힘들다고 할 때", "o": [["맛있는 거 사줌", "jokbal"], ["옆에 있어 줌", "gukbap"], ["웃겨서 풀어줌", "tteok"]]}],
 compute(a){
  const c={};a.forEach(x=>{if(x.data)c[x.data]=(c[x.data]||0)+1});
  const k=Object.keys(c).sort((p,q)=>c[q]-c[p]||Math.random()-.5)[0],r=R[k];
  return {hit:"나랑 닮은 야식은"+"<br><u>"+r[0]+"</u>",name:"",lines:r[1],q:"?r="+k,
   share:"나랑 닮은 야식 '{n}'래 ㅋㅋ 너는 뭐야?".replace("{n}",r[0]),
   img:[{t:"나랑 닮은 야식",size:46,weight:700,color:"#888"},{t:r[0],size:100,gap:40},{t:r[1][0],size:48,weight:600,color:"#ccc",gap:60},{t:"너는 무슨 야식이야?",size:46,weight:700,color:"#ff453a",gap:80}]};
 }});

</script>
</body>
</html>
