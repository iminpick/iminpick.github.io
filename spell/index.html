<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>맞춤법 10문제, 몇 개 맞나 보자</title>
<meta name="description" content="카톡에서 제일 많이 틀리는 것만 골랐어요, 가족 단톡방에 보내기 좋아요">
<meta property="og:title" content="맞춤법 10문제, 몇 개 맞나 보자">
<meta property="og:description" content="카톡에서 제일 많이 틀리는 것만 골랐어요, 가족 단톡방에 보내기 좋아요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#ffffff;--aon:#000}
.q{margin:36px 0 6px}
#ctx{font-size:14px;color:#666;margin-bottom:auto;min-height:20px}
.tname{font-size:24px;font-weight:800;margin-top:30px}
.senior .big{font-size:34px}.senior .ch{font-size:24px;padding:24px 20px}.senior .small{font-size:17px}.senior .list p{font-size:19px}
</style>
</head>
<body class="senior">
<div class="tline" id="tl" style="display:none"></div>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">맞춤법 퀴즈</p>
  <h1 class="big" id="hook" style="margin-top:14px">카톡에서 제일 많이<br>틀리는 맞춤법 10개</h1>
  <p class="small" style="margin-top:16px">시간 제한은 없어요<br>천천히 골라도 돼요</p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <p id="ctx"></p>
  <div class="choices" id="choices"></div>
</section>
<section class="screen" id="s-wait"><div class="dots"><i></i><i></i><i></i></div></section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div id="extra"></div>
  <p class="tname" id="tname"></p>
  <div class="list" id="list"></div>
  <div class="ad"></div>
  <div><button class="go" id="share">가족 단톡방에 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <button class="again" id="again">다시 하기</button>
  <p class="foot">재미로 푸는 퀴즈예요<br>답은 저장하지 않아요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/quick.js"></script>
<script>

const Y={ok:true},N={ok:false},fs=PICK.param("s");
quickTest({id:"spell",limit:0,shuffle:true,feedback:true,
 friend:()=>fs?["보낸 사람은 "+fs+"개 맞혔대요","몇 개 맞힐 수 있을까요?"]:null,
 questions:[
  {q:"___에 만나서 반가웠어",o:[["오랜만",Y],["오랫만",N]]},
  {q:"그거 ___ 끝났어",o:[["금세",Y],["금새",N]]},
  {q:"여행 ___ 남았어?",o:[["며칠",Y],["몇일",N]]},
  {q:"내일 연락 ___",o:[["할게",Y],["할께",N]]},
  {q:"이번 일에서 네 ___이 커",o:[["역할",Y],["역활",N]]},
  {q:"이거 먹어도 ___?",o:[["돼",Y],["되",N]]},
  {q:"아직 밥 ___ 먹었어",o:[["안",Y],["않",N]]},
  {q:"___일로 전화했어?",o:[["웬",Y],["왠",N]]},
  {q:"나 이제 ___?",o:[["어떡해",Y],["어떻해",N]]},
  {q:"내 ___은 우리 가족 건강한 거야",o:[["바람",Y],["바램",N]]}
 ],
 compute(a){
  const right=a.filter(x=>x.data&&x.data.ok).length,wrong=a.filter(x=>!(x.data&&x.data.ok));
  let name,lines;
  if(right===10){name="국어 선생님 수준";lines=["10개 다 맞힌 사람 주변에 별로 없어요","가족 단톡방 맞춤법은 이제 당신 담당이에요","틀린 거 보면 고쳐주고 싶은 마음, 참는 중이죠?"]}
  else if(right>=8){name="맞춤법 지킴이";lines=["헷갈리는 것도 대부분 맞혔어요","한두 개는 누구나 틀려요","카톡 보내기 전에 한 번 더 보는 편이에요"]}
  else if(right>=5){name="보통 한국 사람";lines=["딱 평균이에요, 다들 이 정도는 틀려요","'되/돼'는 어른들도 제일 많이 틀려요","오늘 틀린 것만 기억하면 충분해요"]}
  else{name="소리 나는 대로 쓰는 편";lines=["괜찮아요, 뜻은 다 통해요","틀린 거 아래에 정답 적어뒀어요","다시 해보면 점수 바로 올라가요"]}
  const wl=wrong.map(x=>"'"+(x.pick||"선택 안 함")+"' → <b>'"+x.otherText[x.others.findIndex(o=>o&&o.ok)]+"'</b>").slice(0,5);
  return {hit:"10개 중 <u>"+right+"개</u> 맞혔어요",name,lines,
   html:wl.length?'<div class="list"><p style="color:#888;border:0">틀린 것</p>'+wl.map(x=>"<p>"+x+"</p>").join("")+"</div>":"",
   q:"?s="+right,share:"맞춤법 10문제 중에 "+right+"개 맞혔어요 ㅎㅎ 몇 개 맞히시나 해보세요",
   img:[{t:"맞춤법 10문제",size:46,weight:700,color:"#888"},{t:right+"개 맞힘",size:150,gap:40},{t:name,size:70,gap:20},{t:"몇 개 맞힐 수 있을까요?",size:48,weight:700,color:"#ccc",gap:80}]};
 }});

</script>
</body>
</html>
