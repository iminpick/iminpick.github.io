<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>회사에서 나는 어떤 캐릭터일까</title>
<meta name="description" content="회의, 메신저, 회식에서 다 티가 나요">
<meta property="og:title" content="회사에서 나는 어떤 캐릭터일까">
<meta property="og:description" content="회의, 메신저, 회식에서 다 티가 나요">
<link rel="stylesheet" href="../assets/core.css">
<style>
:root{--a:#0a84ff;--aon:#fff}
.q{margin:36px 0 6px}
#ctx{font-size:14px;color:#666;margin-bottom:auto;min-height:20px}
.tname{font-size:24px;font-weight:800;margin-top:30px}

</style>
</head>
<body class="">
<div class="tline" id="tl" style="display:none"></div>
<div class="app">
<section class="screen on" id="s-start">
  <p class="small" id="pre">직장인 캐릭터 테스트</p>
  <h1 class="big" id="hook" style="margin-top:14px">회사에서 나는<br>어떤 캐릭터일까요?</h1>
  <p class="small" style="margin-top:16px">직장인, 알바생 다 해볼 수 있어요<br>9문제면 끝나요</p>
  <div style="margin-top:auto"><button class="go" id="go">시작</button></div>
</section>
<section class="screen" id="s-quiz">
  <span class="count" id="count"></span>
  <h2 class="big q" id="q"></h2>
  <p id="ctx"></p>
  <div class="choices" id="choices"></div>
</section>
<section class="screen" id="s-wait"><div class="dots"><i></i><i></i><i></i></div></section>
<section class="screen reveal" id="s-result">
  <p class="small">결과</p>
  <p class="hit" id="hit"></p>
  <div id="extra"></div>
  <p class="tname" id="tname"></p>
  <div class="list" id="list"></div>
  <div class="ad"></div>
  <div><button class="go" id="share">팀 단톡방에 보내기</button><div class="row"><button class="sub" id="save">이미지 저장</button><button class="sub" id="copy">링크 복사</button></div></div>
  <div class="next" id="next"></div>
  <button class="again" id="again">다시 하기</button>
  <p class="foot">재미로 보는 테스트예요<br>답은 저장하지 않아요</p>
</section>
</div>
<script src="../assets/core.js"></script>
<script src="../assets/quick.js"></script>
<script>

const R={"fixer": ["조용한 해결사", ["말은 없는데 일은 다 돼 있어요", "\"이거 누가 했어요?\" 하면 대부분 당신이에요", "대신 아무도 몰라줘서 가끔 억울해요"]], "meeting": ["회의 지배자", ["회의만 들어가면 말이 많아져요", "\"그거 제가 정리해볼게요\"가 입버릇이에요", "회의 끝나고 할 일이 제일 많은 사람도 당신이에요"]], "clockout": ["칼퇴 장인", ["퇴근 1분 전부터 가방 싸는 소리가 나요", "일은 근무 시간 안에 끝내는 게 원칙이에요", "회식 2차에서 조용히 사라지는 기술이 있어요"]], "mood": ["분위기 메이커", ["탕비실 간식 위치를 제일 잘 알아요", "팀 단톡방 이모티콘 담당이에요", "당신이 휴가 간 날엔 사무실이 조용해요"]], "excel": ["엑셀 마법사", ["남들 10분 걸리는 일을 단축키로 1분에 끝내요", "모르는 사람이 메신저로 함수를 물어봐요", "\"이거 자동으로 안 돼요?\"가 제일 무서운 말이에요"]], "worrier": ["걱정 많은 꼼꼼이", ["보낸 메일을 세 번 다시 읽어요", "\"혹시\"로 시작하는 질문을 제일 많이 해요", "덕분에 팀 실수가 줄어요"]]};
const fk=PICK.param("r");
quickTest({id:"work",limit:0,shuffle:true,
 friend:()=>fk&&R[fk]?["동료는 '{n}' 나왔대요".replace("{n}",R[fk][0]),"나는 회사에서 뭘까요?"]:null,
 questions:[{"q": "월요일 아침 메신저에 \"잠깐 얘기 좀\"", "o": [["일단 할 일부터 확인", "fixer"], ["무슨 일인지 바로 물어봄", "meeting"], ["혹시 내가 뭐 잘못했나", "worrier"]]}, {"q": "회의 시간", "o": [["말 제일 많이 함", "meeting"], ["노트북으로 딴 일 처리", "fixer"], ["회의록 정리 담당", "excel"]]}, {"q": "점심시간", "o": [["메뉴 정하는 사람", "mood"], ["혼자 조용히 먹고 쉼", "clockout"], ["먹으면서도 일 얘기", "meeting"]]}, {"q": "퇴근 5분 전", "o": [["이미 컴퓨터 끌 준비", "clockout"], ["내일 할 일 정리", "worrier"], ["남은 일 마저 끝냄", "fixer"]]}, {"q": "새 프로그램이 도입됨", "o": [["단축키부터 외움", "excel"], ["설명서를 꼼꼼히 읽음", "worrier"], ["옆자리에 물어봄", "mood"]]}, {"q": "회식 자리에서", "o": [["건배사 담당", "mood"], ["1차만 하고 귀가", "clockout"], ["팀장 옆에서 일 얘기", "meeting"]]}, {"q": "급한 일이 터졌다", "o": [["조용히 혼자 해결", "fixer"], ["엑셀로 정리부터", "excel"], ["팀원들 다 불러 모음", "meeting"]]}, {"q": "메일 보내기 전", "o": [["세 번 읽어봄", "worrier"], ["그냥 보냄", "clockout"], ["만들어둔 템플릿 씀", "excel"]]}, {"q": "휴가 쓸 때", "o": [["눈치 안 보고 씀", "clockout"], ["인수인계 문서 5장", "worrier"], ["팀 단톡에 여행 사진", "mood"]]}],
 compute(a){
  const c={};a.forEach(x=>{if(x.data)c[x.data]=(c[x.data]||0)+1});
  const k=Object.keys(c).sort((p,q)=>c[q]-c[p]||Math.random()-.5)[0],r=R[k];
  return {hit:"회사에서 나는"+"<br><u>"+r[0]+"</u>",name:"",lines:r[1],q:"?r="+k,
   share:"회사에서 나는 '{n}'래 ㅋㅋ 너는?".replace("{n}",r[0]),
   img:[{t:"회사에서 나는",size:46,weight:700,color:"#888"},{t:r[0],size:100,gap:40},{t:r[1][0],size:48,weight:600,color:"#ccc",gap:60},{t:"너는 무슨 캐릭터야?",size:46,weight:700,color:"#0a84ff",gap:80}]};
 }});

</script>
</body>
</html>
